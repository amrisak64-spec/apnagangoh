<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">लिस्टिंग — गंगोह.in</title>
  <meta name="description" id="page-desc" content="गंगोह प्रॉपर्टी लिस्टिंग — गंगोह.in">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=18">

  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/images/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#5B35D5">
</head>
<body>
  <header id="site-header"></header>

  <main class="container section" id="main-content">
    <div class="spinner"></div>
  </main>

  <footer id="site-footer"></footer>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script type="module">
    import { mountUI, toast, formatPrice, waURL, categoryIconHTML } from './assets/js/ui.js?v=7';
    import { initListings, fetchListing, deleteListing } from './assets/js/listings.js?v=8';
    import { initReports, createReport } from './assets/js/reports.js?v=5';
    import { ALL_LOCATIONS } from './data/villages.js?v=5';

    let fbConfig;
    try {
      const m = await import('./assets/js/firebase-config.js?v=5');
      fbConfig = m.firebaseConfig;
    } catch {
      document.getElementById('main-content').innerHTML =
        `<div style="text-align:center;padding:4rem;">⚠️ Firebase config नहीं मिला।</div>`;
      throw new Error('missing');
    }

    if (!firebase.apps.length) firebase.initializeApp(fbConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();
    let viewerUid = null;
    mountUI();
    initListings(db, storage, auth);
    initReports(db);

    // Clean SEO URLs (/property/<slug>-<id>, /vehicles/<slug>-<id>) are served by the `pages` Cloud Function,
    // which already put the bilingual title, description and structured data in the HTML (data-ssr="1").
    const SSR = document.documentElement.dataset.ssr === '1';
    const pathMatch = location.pathname.match(/^\/(?:property|vehicles)\/.*-([A-Za-z0-9]{20})\/?$/);
    const id = new URLSearchParams(location.search).get('id') || (pathMatch ? pathMatch[1] : null);
    const main = document.getElementById('main-content');

    if (!id) {
      main.innerHTML = `<div class="empty-state"><span class="empty-icon">❓</span><p>लिस्टिंग नहीं मिली।</p><a href="browse.html" class="btn btn-primary" style="margin-top:1rem;">Browse करें</a></div>`;
    } else {
      auth.onAuthStateChanged(user => {
        viewerUid = user?.uid || null;
        loadListing(id);
      });
    }

    async function loadListing(listingId) {
      try {
        const listing = await fetchListing(listingId);
        if (!listing || (!['live', 'sold', 'rented'].includes(listing.status) && listing.ownerId !== viewerUid)) {
          main.innerHTML = `<div class="empty-state"><span class="empty-icon">🚫</span><p>यह listing उपलब्ध नहीं है।</p><a href="browse.html" class="btn btn-primary" style="margin-top:1rem;">Browse करें</a></div>`;
          return;
        }
        renderListing(listing);
        if (new URLSearchParams(location.search).get('updated') === '1') toast('आपकी listing अपडेट हो गई।', 'success');
      } catch (err) {
        main.innerHTML = `<div class="empty-state"><p>Error: ${err.message}</p></div>`;
      }
    }

    function renderListing(l) {
      if (l.type === 'vehicle' || l.category === 'vehicle') {
        renderVehicleListing(l);
        injectJsonLd(l);
        return;
      }
      if (!SSR) document.getElementById('page-title').textContent = `${l.title} — ${l.village || 'गंगोह'} | गंगोह.in`;
      if (!SSR) document.getElementById('page-desc').content = `${l.title} — ${l.purpose === 'sale' ? 'बिक्री' : 'किराये'} पर। कीमत: ${formatPrice(l.price)}। ${l.village || 'गंगोह'}, Gangoh।`;

      const typeLabel    = { plot:'प्लॉट', house:'मकान', shop:'दुकान', agri:'खेती की ज़मीन' }[l.type] || l.type;
      const purposeLabel = l.purpose === 'sale' ? 'बिक्री' : 'किराया';
      const availabilityBadge = listingAvailabilityBadge(l);

      // Smart headline: "200 गज का प्लॉट", "6 बीघा खेती की ज़मीन" etc.
      const headlineMap = {
        plot:  l.areaSize ? `${l.areaSize} ${l.areaUnit || 'गज'} का प्लॉट`        : 'प्लॉट',
        house: l.areaSize ? `${l.areaSize} ${l.areaUnit || 'गज'} का मकान`         : 'मकान',
        shop:  l.areaSize ? `${l.areaSize} ${l.areaUnit || 'गज़'} की दुकान`        : 'दुकान',
        agri:  l.areaSize ? `${l.areaSize} ${l.areaUnit || 'बीघा'} खेती की ज़मीन` : 'खेती की ज़मीन',
      };
      const headline = headlineMap[l.type] || l.title;

      // Price breakup rows
      const breakupRows = [];
      if (l.ratePerGaj)    breakupRows.push(['रेट', `₹${Number(l.ratePerGaj).toLocaleString('hi-IN')} / गज`]);
      if (l.ratePerBigha)  breakupRows.push(['रेट', `₹${Number(l.ratePerBigha).toLocaleString('hi-IN')} / बीघा`]);
      if (l.areaSize)      breakupRows.push(['साइज़', `${l.areaSize} ${l.areaUnit || ''}`]);
      if (l.roadSizeFeet)  breakupRows.push(['सड़क चौड़ाई', `${l.roadSizeFeet} फ़ुट`]);
      if (l.storey)        breakupRows.push(['मंज़िल', l.storey === 'single' ? 'Single Storey' : l.storey === 'double' ? 'Double Storey' : 'Triple Storey']);
      if (l.rooms)         breakupRows.push(['कमरे', l.rooms]);
      if (l.securityDeposit) breakupRows.push(['Security Deposit', formatPrice(l.securityDeposit)]);
      if (l.pagdi)         breakupRows.push(['पगड़ी', formatPrice(l.pagdi)]);

      const breakupHTML = breakupRows.length ? `
        <div style="border:1.5px solid #EDE9FE;border-radius:0.75rem;overflow:hidden;margin-top:1rem;">
          ${breakupRows.map(([k,v], i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.65rem 1rem;${i<breakupRows.length-1?'border-bottom:1px solid #F5F3FF;':''}background:${i%2===0?'#FAFAFA':'white'};">
            <span style="font-size:0.88rem;color:#6B6B6B;">${escapeHtml(k)}</span>
            <span style="font-size:0.95rem;font-weight:700;color:#1A1A1A;">${escapeHtml(v)}</span>
          </div>`).join('')}
        </div>` : '';

      // Gallery
      const photos = l.photos && l.photos.length ? l.photos : [];
      const galleryHTML = photos.length
        ? `<div class="gallery">
            <img class="gallery-main" id="gallery-main" src="${escapeHtml(photos[0])}" alt="${escapeHtml(l.title)}">
            ${photos.length > 1 ? `<div class="gallery-thumbs">${photos.map((p,i) =>
              `<img class="gallery-thumb${i===0?' active':''}" data-full="${escapeHtml(p)}" src="${escapeHtml(p)}" alt="photo ${i+1}">`
            ).join('')}</div>` : ''}
           </div>`
        : `<div style="width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#F0EDE8,#E5E0DA);border-radius:0.75rem;display:flex;align-items:center;justify-content:center;">${categoryIconHTML(l.type, 'gallery-fallback-icon')}</div>`;

      const waMsg  = `नमस्ते, मुझे ${headline} (${purposeLabel} | ${formatPrice(l.price)}) के बारे में जानकारी चाहिए। गंगोह.in पर देखा।`;
      const waLink = l.contactWhatsApp ? waURL(l.contactWhatsApp, waMsg) : '#';

      main.innerHTML = `
<div style="margin-bottom:1rem;">
  <a href="browse.html" style="color:#888;font-size:0.9rem;">← वापस जाएं</a>
</div>

<div class="detail-grid">
  <!-- Left: Headline + Gallery + Details -->
  <div>

    <!-- BIG HEADLINE -->
    <div style="background:white;border-radius:0.75rem;padding:1.25rem 1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.07);">

      <!-- Badges -->
      <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.75rem;">
        <span class="badge ${l.purpose==='sale'?'badge-sale':'badge-rent'}">${purposeLabel}</span>
        ${availabilityBadge}
        ${l.isVerified ? `<span class="badge badge-verified">✓ Verified</span>` : ''}
        ${l.isFeatured ? `<span class="badge badge-featured">⭐ Featured</span>` : ''}
      </div>

      <!-- Size + Type — BIG RED -->
      <h1 style="font-size:clamp(1.8rem,6vw,2.6rem);font-weight:900;color:#DC2626;line-height:1.15;margin-bottom:0.35rem;letter-spacing:-0.02em;">${escapeHtml(headline)}</h1>

      <!-- User title as subtitle -->
      <p style="font-size:1rem;color:#555;margin:0 0 0.85rem;line-height:1.5;">${escapeHtml(l.title)}</p>

      <!-- Location -->
      <div style="display:flex;flex-wrap:wrap;gap:0.4rem 1.25rem;font-size:0.95rem;color:#444;">
        <span>📍 <strong>${escapeHtml(l.village || 'गंगोह')}</strong></span>
        ${l.locality ? `<span>🏘️ ${escapeHtml(l.locality)}</span>` : ''}
        ${l.landmark ? `<span>🚩 ${escapeHtml(l.landmark)}</span>` : ''}
      </div>

      <hr style="margin:1rem 0;border:none;border-top:1.5px solid #F5F3FF;">

      <!-- Full Price -->
      <div style="margin-bottom:0.2rem;font-size:0.8rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.08em;">
        ${l.purpose === 'rent' ? 'मासिक किराया' : 'कुल कीमत'}
      </div>
      <div style="font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;color:#5B35D5;line-height:1.1;">
        ${formatPrice(l.price)}${l.purpose === 'rent' ? '<span style="font-size:1rem;font-weight:600;color:#888;"> / माह</span>' : ''}
      </div>

      <!-- Price Breakup -->
      ${breakupHTML}
    </div>

    <!-- Gallery -->
    ${galleryHTML}

    <!-- Description -->
    ${l.description ? `
    <div style="background:white;border-radius:0.75rem;padding:1.25rem 1.5rem;margin-top:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.07);">
      <h3 style="font-size:1rem;font-weight:800;margin-bottom:0.5rem;">विवरण</h3>
      <p style="color:#555;line-height:1.8;white-space:pre-wrap;font-size:0.95rem;">${formatDescription(l.description)}</p>
    </div>` : ''}
  </div>

  <!-- Right: Contact -->
  <div>
    <div class="detail-info-card" style="position:sticky;top:80px;">
      <!-- Mini price repeat for sticky sidebar -->
      <div style="font-size:1.4rem;font-weight:900;color:#DC2626;margin-bottom:0.15rem;">${escapeHtml(headline)}</div>
      <div style="font-size:1.1rem;font-weight:800;color:#5B35D5;margin-bottom:1rem;">${formatPrice(l.price)}${l.purpose==='rent'?' / माह':''}</div>
      <hr style="margin:0 0 1rem;border:none;border-top:1.5px solid #F0EDE8;">

      ${l.contactWhatsApp
        ? `<a href="${waLink}" class="whatsapp-btn" target="_blank" rel="noopener">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WhatsApp पर संपर्क करें
           </a>`
        : `<p style="color:#888;text-align:center;padding:1rem;">Contact नंबर उपलब्ध नहीं</p>`
      }

      <div style="margin-top:0.75rem;display:flex;flex-direction:column;gap:0.5rem;">
        <a id="wa-share-btn" href="#" target="_blank" rel="noopener"
           style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem;border-radius:0.5rem;font-weight:700;font-size:0.95rem;background:#25D366;color:white;text-decoration:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp पर Share करें
        </a>
        <a id="fb-share-btn" href="#" target="_blank" rel="noopener"
           style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem;border-radius:0.5rem;font-weight:700;font-size:0.95rem;background:#1877F2;color:white;text-decoration:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook पर Share करें
        </a>
        <button id="copy-link-btn"
           style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem;border-radius:0.5rem;font-weight:700;font-size:0.95rem;background:white;color:#5B35D5;border:2px solid #5B35D5;cursor:pointer;width:100%;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Link Copy करें
        </button>
      </div>

      <div style="margin-top:1.25rem;padding-top:1rem;border-top:1.5px solid #F0EDE8;">
        <p style="font-size:0.8rem;color:#888;margin:0 0 0.3rem;">पोस्ट की तारीख</p>
        <p style="font-size:0.85rem;color:#555;" id="posted-date">—</p>
      </div>
      <div style="margin-top:0.75rem;">
        <button id="report-btn" style="background:none;border:none;padding:0;font-size:0.8rem;color:#DC2626;cursor:pointer;font-family:inherit;text-decoration:underline;">🚩 फर्ज़ी लिस्टिंग रिपोर्ट करें</button>
      </div>
      ${ownerActionsHTML(l)}
    </div>
  </div>
</div>`;

      // Set posted date
      if (l.createdAt?.toDate) {
        document.getElementById('posted-date').textContent =
          l.createdAt.toDate().toLocaleDateString('hi-IN', { year:'numeric', month:'long', day:'numeric' });
      }

      // Gallery thumb clicks
      document.querySelectorAll('.gallery-thumb').forEach(thumb => {
        thumb.addEventListener('click', () => {
          document.getElementById('gallery-main').src = thumb.dataset.full;
          document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        });
      });

      // WhatsApp share
      const waShareText = encodeURIComponent(`🏘️ ${l.title}\n💰 ${formatPrice(l.price)} | 📍 ${l.village || 'गंगोह'}\n\nगंगोह.in पर देखें: ${location.href}`);
      document.getElementById('wa-share-btn').href = `https://wa.me/?text=${waShareText}`;

      // Facebook share
      document.getElementById('fb-share-btn').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`;

      // Copy link
      document.getElementById('copy-link-btn')?.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          const btn = document.getElementById('copy-link-btn');
          btn.textContent = '✓ Link Copy हो गया!';
          btn.style.background = '#D1FAE5';
          btn.style.color = '#065F46';
          btn.style.borderColor = '#065F46';
          setTimeout(() => {
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Link Copy करें`;
            btn.style.background = 'white'; btn.style.color = '#5B35D5'; btn.style.borderColor = '#5B35D5';
          }, 2000);
        } catch {
          toast('Link copy नहीं हो सका', 'error');
        }
      });

      // Report fake listing
      document.getElementById('report-btn')?.addEventListener('click', () => openReportModal(l));

      // Structured data
      injectJsonLd(l);
      bindOwnerActions(l);
    }

    // Change 2: vehicle detail omits insurance; legacy scooter records display as bikes.
    // Vehicle detail uses the existing listing route while providing vehicle specs and a mobile contact bar.
    function renderVehicleListing(l) {
      const year = Number.isInteger(l.year) ? String(l.year) : '';
      const brand = typeof l.brand === 'string' ? l.brand.trim() : '';
      const model = typeof l.model === 'string' ? l.model.trim() : '';
      const title = [year, brand, model].filter(Boolean).join(' ') || l.title || 'कार और बाइक बिक्री के लिए';
      const kind = l.vehicleType === 'car' ? 'कार' : 'बाइक';
      const englishKind = l.vehicleType === 'car' ? 'Car' : 'Bike';
      const phone = String(l.phone || l.contactWhatsApp || '').replace(/\D/g, '');
      const phoneDigits = phone.length === 10 ? `91${phone}` : phone;
      const phoneForCall = phone.length === 10 ? `+91${phone}` : phone;
      const price = Number(l.price);
      const priceLabel = Number.isFinite(price) && price > 0
        ? (price >= 100000 ? `₹${(price / 100000).toFixed(2)} लाख` : `₹${price.toLocaleString('en-IN')}`)
        : 'कीमत पूछें';
      const fuelLabel = { petrol: 'पेट्रोल', diesel: 'डीज़ल', cng: 'CNG', electric: 'इलेक्ट्रिक' }[l.fuelType] || l.fuelType;
      const ownerLabel = { '1st': 'पहला मालिक', '2nd': 'दूसरा मालिक', '3rd+': 'तीसरा या अधिक मालिक' }[l.ownerNumber] || l.ownerNumber;
      const sellerLabel = l.listerType === 'dealer' ? 'डीलर' : l.listerType === 'owner' ? 'मालिक' : '';
      const hasKm = l.kmDriven !== null && l.kmDriven !== undefined && l.kmDriven !== '' && Number.isFinite(Number(l.kmDriven));
      const rows = [
        ['गाड़ी', kind], ['ब्रांड', brand], ['मॉडल', model], ['मॉडल वर्ष', year],
        ['ईंधन', fuelLabel], [hasKm ? 'चली दूरी' : '', hasKm ? `${Number(l.kmDriven).toLocaleString('en-IN')} किमी` : ''],
        ['मालिक', ownerLabel], ['रजिस्ट्रेशन', l.registrationState],
        ['विक्रेता', sellerLabel],
        ['ट्रांसमिशन', l.transmission === 'automatic' ? 'Automatic' : l.transmission === 'manual' ? 'Manual' : ''],
        ['रजिस्ट्रेशन के आख़िरी 4 अंक', l.registrationLast4],
        ['इंजन क्षमता', l.cc ? `${Number(l.cc).toLocaleString('en-IN')} CC` : ''],
        ['मोलभाव', l.negotiable ? 'हाँ' : (typeof l.negotiable === 'boolean' ? 'नहीं' : '')],
      ].filter(([label, value]) => label && value !== undefined && value !== null && value !== '');
      const photos = Array.isArray(l.photos) ? l.photos.filter(url => typeof url === 'string' && url.trim()) : [];
      const gallery = photos.length
        ? `<div class="vehicle-detail-gallery" aria-label="गाड़ी की तस्वीरें">${photos.map((photo, index) => `<img src="${escapeHtml(photo)}" alt="${escapeHtml(title)} — तस्वीर ${index + 1}" loading="lazy">`).join('')}</div>`
        : '<div class="vehicle-detail-placeholder">📷 फोटो जल्द उपलब्ध</div>';
      const waMessage = `नमस्ते, मुझे ${title} के बारे में जानकारी चाहिए। यह गाड़ी मुझे गंगोह.in पर मिली: ${location.href}`;
      const waHref = phoneDigits ? waURL(phoneDigits, waMessage) : '';
      const badges = [
        `<span class="badge ${l.purpose === 'rent' ? 'badge-rent' : 'badge-sale'}">${l.purpose === 'rent' ? 'किराया' : 'बिक्री'}</span>`,
        `<span class="badge vehicle-seller-badge">${escapeHtml(sellerLabel || kind)}</span>`,
        l.listerType === 'owner' || !l.listerType ? '<span class="badge vehicle-direct-badge">📞 Direct</span>' : '',
        listingAvailabilityBadge(l),
        (l.isVerified || l.verified) ? '<span class="badge vehicle-verified-badge">✓ Verified</span>' : '',
        l.negotiable ? '<span class="badge vehicle-negotiable-badge">मोलभाव संभव</span>' : '',
      ].filter(Boolean).join('');
      const locationText = [l.locality, l.village].filter(value => typeof value === 'string' && value.trim()).join(' · ');

      if (!SSR) document.getElementById('page-title').textContent = `${title} — Used ${englishKind} for sale in Gangoh | कार और बाइक बिक्री के लिए — Gangoh.in`;
      if (!SSR) document.getElementById('page-desc').content = `${title} (${kind}) गंगोह में बिक्री के लिए। ${fuelLabel ? `${fuelLabel}, ` : ''}${hasKm ? `${Number(l.kmDriven).toLocaleString('en-IN')} किमी चली, ` : ''}${priceLabel}। गाड़ी देखने से पहले जाँच ज़रूर करें।`;

      main.innerHTML = `
        <p style="margin-bottom:1rem;"><a href="vehicles.html" style="color:#888;font-size:.9rem;">← कार और बाइक की सभी लिस्टिंग</a></p>
        <div class="detail-grid vehicle-detail-grid">
          <div>
            <section class="vehicle-detail-summary" style="background:white;border-radius:.8rem;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--shadow-card);">
              <div class="vehicle-card-badges">${badges}</div>
              <h1 style="font-size:clamp(1.5rem,5vw,2.2rem);margin:.5rem 0;color:var(--color-text);overflow-wrap:anywhere;">${escapeHtml(title)}</h1>
              ${locationText ? `<p style="margin:0;color:var(--color-muted);">📍 ${escapeHtml(locationText)}</p>` : ''}
              <p style="margin:.65rem 0 0;color:var(--color-saffron);font-size:1.8rem;font-weight:900;">${escapeHtml(priceLabel)}</p>
            </section>
            ${gallery}
            <h2 style="margin:1.2rem 0 .5rem;font-size:1.2rem;">गाड़ी की पूरी जानकारी</h2>
            <table class="vehicle-spec-table"><tbody>${rows.map(([label, value]) => `<tr><th scope="row">${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`).join('')}</tbody></table>
            ${l.description ? `<section style="background:white;border-radius:.8rem;padding:1rem 1.2rem;margin-top:1rem;box-shadow:var(--shadow-card);"><h2 style="font-size:1.1rem;">विवरण</h2><p style="white-space:pre-wrap;overflow-wrap:anywhere;color:var(--color-muted);">${formatDescription(l.description)}</p></section>` : ''}
            <p class="vehicle-detail-safety">खरीदने से पहले RC और गाड़ी की जाँच ज़रूर करें।</p>
          </div>
          <aside class="detail-info-card"><h2 style="font-size:1.1rem;">विक्रेता से संपर्क करें</h2><p style="color:var(--color-saffron);font-size:1.3rem;font-weight:900;">${escapeHtml(priceLabel)}</p>
            ${phoneForCall ? `<a class="vehicle-card-call vehicle-detail-action" href="tel:${escapeHtml(phoneForCall)}">📞 कॉल करें</a>` : ''}
            ${waHref ? `<a class="vehicle-card-whatsapp vehicle-detail-action" href="${escapeHtml(waHref)}" target="_blank" rel="noopener">WhatsApp पर संदेश भेजें</a>` : '<p style="color:var(--color-muted);">संपर्क नंबर उपलब्ध नहीं</p>'}
            ${sellerLabel ? `<p style="margin-top:1rem;color:var(--color-muted);">विक्रेता: ${escapeHtml(sellerLabel)}</p>` : ''}
            ${ownerActionsHTML(l)}
          </aside>
        </div>
        ${phoneForCall ? `<nav class="vehicle-mobile-contact" aria-label="विक्रेता से संपर्क"><a href="tel:${escapeHtml(phoneForCall)}">📞 कॉल करें</a>${waHref ? `<a href="${escapeHtml(waHref)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</nav>` : ''}`;
      bindOwnerActions(l);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function listingAvailabilityBadge(listing) {
      const value = listing.availability || (listing.status === 'sold' ? 'sold' : listing.status === 'rented' ? 'rented' : 'active');
      if (value === 'sold') return '<span class="badge listing-sold-badge">बिक चुका / Sold</span>';
      if (value === 'rented') return '<span class="badge listing-sold-badge">किराये पर दिया / Rented</span>';
      return '';
    }

    function ownerActionsHTML(listing) {
      if (!viewerUid || listing.ownerId !== viewerUid) return '';
      return `<div class="owner-listing-actions"><a class="btn btn-outline btn-sm" href="edit-listing.html?id=${encodeURIComponent(listing.id)}">✏️ Edit Listing</a><button class="btn btn-danger btn-sm" type="button" id="owner-delete-listing">🗑️ Delete Listing</button></div>`;
    }

    function bindOwnerActions(listing) {
      document.getElementById('owner-delete-listing')?.addEventListener('click', async event => {
        if (!confirm('इस listing और इसकी फ़ोटो को हमेशा के लिए हटाना चाहते हैं?')) return;
        const button = event.currentTarget;
        button.disabled = true;
        try {
          await deleteListing(listing.id);
          toast('Listing delete हो गई।', 'success');
          location.href = 'my-listings.html';
        } catch (error) {
          button.disabled = false;
          toast(error.message || 'Listing हटाई नहीं जा सकी।', 'error');
        }
      });
    }

    // Descriptions accept a small Markdown subset. Escape first so raw HTML is never trusted.
    function formatDescription(value) {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\r?\n/g, '<br>');
    }

    // ── RealEstateListing structured data ─────────────────────
    function injectJsonLd(l) {
      if (SSR) return;
      document.querySelectorAll('script[data-listing-ld]').forEach(el => el.remove());
      const isVehicle = l.type === 'vehicle' || l.category === 'vehicle';
      const vehicleTitle = [Number.isInteger(l.year) ? l.year : '', l.brand, l.model].filter(value => value !== null && value !== undefined && String(value).trim()).join(' ') || l.title;
      const ld = isVehicle ? {
        '@context': 'https://schema.org/',
        '@type': ['Product', 'Vehicle'],
        name: vehicleTitle,
        description: l.description || vehicleTitle,
        url: location.href,
        ...(l.photos && l.photos.length ? { image: l.photos } : {}),
        ...(l.brand ? { brand: { '@type': 'Brand', name: l.brand } } : {}),
        ...(l.model ? { model: l.model } : {}),
        ...(Number.isInteger(l.year) ? { vehicleModelDate: String(l.year) } : {}),
        ...(l.vehicleType ? { vehicleConfiguration: l.vehicleType === 'car' ? 'Car' : 'Motorcycle' } : {}),
        ...(Number.isFinite(Number(l.kmDriven)) && l.kmDriven != null ? { mileageFromOdometer: { '@type': 'QuantitativeValue', value: Number(l.kmDriven), unitCode: 'KMT' } } : {}),
        ...(l.fuelType ? { fuelType: l.fuelType } : {}),
        itemCondition: 'https://schema.org/UsedCondition',
        offers: { '@type': 'Offer', price: Number(l.price) || undefined, priceCurrency: 'INR', availability: 'https://schema.org/InStock' },
      } : {
        '@context': 'https://schema.org/',
        '@type': 'RealEstateListing',
        name: l.title,
        description: l.description || l.title,
        url: location.href,
        ...(l.photos && l.photos.length ? { image: l.photos } : {}),
        offers: {
          '@type': 'Offer',
          price: l.price,
          priceCurrency: 'INR',
          availability: l.purpose === 'rent' ? 'https://schema.org/InStock' : 'https://schema.org/InStock',
        },
        address: { '@type': 'PostalAddress', addressLocality: l.village || 'Gangoh', addressRegion: 'UP', addressCountry: 'IN' },
      };
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.dataset.listingLd = '1';
      script.textContent = JSON.stringify(ld).replace(/</g, '\\u003c');
      document.head.appendChild(script);
    }

    // ── Report fake listing modal ─────────────────────────────
    function openReportModal(l) {
      const existing = document.getElementById('report-modal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'report-modal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;';
      modal.innerHTML = `
        <div style="background:white;border-radius:1rem;padding:1.5rem;width:100%;max-width:420px;">
          <h3 style="margin:0 0 0.5rem;font-size:1.1rem;color:#DC2626;">🚩 फर्ज़ी लिस्टिंग रिपोर्ट करें</h3>
          <p style="font-size:0.85rem;color:#888;margin:0 0 1rem;">हम 24 घंटे में review करेंगे। आपकी जानकारी सिर्फ़ admin देखेगा।</p>
          <div class="form-group">
            <label style="font-size:0.85rem;font-weight:600;">क्या गलत है? *</label>
            <textarea id="report-reason" class="form-control" rows="3" placeholder="जैसे: फ़ोन नंबर काम नहीं करता, कीमत गलत है, प्रॉपर्टी मौजूद नहीं..."></textarea>
          </div>
          <div class="form-group">
            <label style="font-size:0.85rem;font-weight:600;">आपका नंबर <span style="font-weight:400;color:#888;">(वैकल्पिक)</span></label>
            <input id="report-contact" class="form-control" type="tel" maxlength="10" placeholder="10 अंक का नंबर">
          </div>
          <p id="report-error" style="color:#DC2626;font-size:0.85rem;margin:0 0 0.5rem;display:none;"></p>
          <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
            <button id="report-submit-btn" class="btn btn-danger" style="flex:1;">🚩 Report करें</button>
            <button id="report-cancel-btn" class="btn btn-outline" style="flex:1;">Cancel</button>
          </div>
        </div>`;

      document.body.appendChild(modal);
      document.getElementById('report-cancel-btn').onclick = () => modal.remove();
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

      document.getElementById('report-submit-btn').onclick = async () => {
        const reason = document.getElementById('report-reason').value.trim();
        const contact = document.getElementById('report-contact').value.trim();
        const errEl = document.getElementById('report-error');
        if (!reason) { errEl.textContent = 'कृपया कारण बताएं।'; errEl.style.display = 'block'; return; }

        const btn = document.getElementById('report-submit-btn');
        btn.disabled = true; btn.textContent = 'Submit हो रहा है...';
        try {
          await createReport({ listingId: l.id, listingTitle: l.title, reason, reporterContact: contact });
          modal.remove();
          toast('Report मिल गई — धन्यवाद! हम review करेंगे।', 'success');
        } catch (err) {
          errEl.textContent = `Error: ${err.message}`; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = '🚩 Report करें';
        }
      };
    }
  </script>
</body>
</html>
